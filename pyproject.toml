[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtscan"
version = "0.1.0"
description = "Windows desktop app that scans PDF invoices and renames them by date, supplier, and description."
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "Pillow>=10.0"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.gui-scripts]
dtscan = "dtscan.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
